name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/qr612-webapp-jgnnrf
      - main
  workflow_dispatch:

# GITHUB_TOKEN 이 Pages 에 배포할 수 있도록 하는 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 진행 중인 배포는 취소하지 않고, 큐에 하나만 대기시킨다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "dist/index.html 이 없습니다"; exit 1; }
          test -f dist/CNAME || { echo "dist/CNAME 이 없습니다 (커스텀 도메인 유실 위험)"; exit 1; }
          echo "custom domain: $(cat dist/CNAME)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
